site_name: AKTools 官方文档
site_description: AKTools framework, high performance, easy to learn, fast to code, ready for production
site_url: https://aktools.akfamily.xyz/
theme:
  name: material
  logo: https://fastapi.tiangolo.com/img/icon-white.svg
  favicon: https://fastapi.tiangolo.com/img/favicon.png
  language: zh
  features:
    - content.code.annotate
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
repo_name: akfamily/aktools
repo_url: https://github.com/akfamily/aktools

nav:
  - 首页: index.md
  - 快速开始: aktools.md
  - API 参考:
    - HTTP API 全集: api-reference.md
    - V1 新增接口: v1-api.md
    - 数据源差异与归一化: source-differences.md
  - 部署:
    - Docker 部署指南: docker-howto.md
  - 版本: aktools_version.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - 'css/termynal.css'
  - 'css/custom.css'

extra_javascript:
  - 'js/termynal.js'
  - 'js/custom.js'
